name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js (o Java según tu proyecto)
        uses: actions/setup-node@v3
        with:
          node-version: '16' # Cambia según versión necesaria

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Run CodeQL Analysis
        uses: github/codeql-action/init@v2
        with:
          languages: 'javascript' # Cambia a java si es java

  #    - name: Perform CodeQL Analysis
  #      uses: github/codeql-action/analyze@v2

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && success()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Deploy to Test Environment
        run: |
          echo "Implementa aquí el script de despliegue"
